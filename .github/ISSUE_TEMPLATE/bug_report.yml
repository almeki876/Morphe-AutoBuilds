name: 問題を報告する
description: ビルド失敗、ダウンロードエラー、APKの動作不良などを報告します。
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        問題の報告ありがとうございます。分かる範囲だけで大丈夫です。
        スクリーンショットやログがある場合は、そのまま下の欄へ貼り付けてください。

  - type: dropdown
    id: problem_type
    attributes:
      label: 問題の種類
      options:
        - APKのダウンロード・取得
        - ビルド・パッチ適用
        - インストール・起動
        - アプリの動作
        - GitHub Actions / リリース
        - その他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 何が起きましたか？
      description: エラー内容や困っていることを、そのまま書いてください。
      placeholder: 例：YouTubeをインストール後、起動するとすぐ終了します。
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: 対象アプリ
      description: アプリに関係する問題の場合だけ入力してください。
      placeholder: 例：YouTube

  - type: input
    id: patch_source
    attributes:
      label: パッチソース
      description: 分かる場合だけ入力してください。
      placeholder: 例：morphe / revanced-anddea

  - type: textarea
    id: reproduction
    attributes:
      label: 再現方法
      description: 同じ問題を再現できる手順があれば入力してください。
      placeholder: |
        1. APKをダウンロード
        2. インストール
        3. 起動すると問題が発生

  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: エラーメッセージ、ActionsのURL、ログ、画像などがあれば貼り付けてください。

  - type: textarea
    id: environment
    attributes:
      label: 補足情報
      description: Androidバージョン、端末名、使用したリリースなど、分かる情報があれば入力してください。
      placeholder: 例：Android 15 / Pixel 8 / 最新リリース
