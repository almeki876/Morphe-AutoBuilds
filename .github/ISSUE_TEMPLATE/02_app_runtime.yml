name: App / installation issue / インストール・アプリ動作の問題
description: Report installation, startup, crash, or feature problems / インストール・起動・クラッシュ・機能の問題を報告
title: "[App] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        English and Japanese reports are both welcome. / 英語・日本語どちらで報告しても構いません。

        Attach screenshots or short, relevant logs by dragging them into the description, pasting them, or using the attachment button. Do not attach APK files, credentials, access tokens, or personal data. Redact secrets and unrelated account/device information before uploading.

        スクリーンショットや必要なログは、説明欄へのドラッグ＆ドロップ、貼り付け、または添付ボタンから追加できます。APK本体、認証情報、アクセストークン、個人情報は添付しないでください。アップロード前に秘密情報や無関係なアカウント・端末情報を伏せてください。

  - type: dropdown
    id: symptom_type
    attributes:
      label: Problem type / 問題の種類
      options:
        - Installation failure / インストールできない
        - Won't start or closes immediately / 起動できない・すぐ終了する
        - Crashes during an action / 特定操作でクラッシュする
        - Patched feature does not work / パッチ機能が動かない
        - Display or UI problem / 表示・UIがおかしい
        - Login or network problem / ログイン・通信に問題がある
        - Other app behavior / その他のアプリ動作
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App / 対象アプリ
      placeholder: 例：YouTube Music
    validations:
      required: true

  - type: input
    id: patch_source
    attributes:
      label: Patch source / パッチソース
      placeholder: 例：morphe / revanced-anddea

  - type: input
    id: architecture
    attributes:
      label: Architecture / アーキテクチャ
      placeholder: 例：arm64-v8a / universal

  - type: input
    id: release
    attributes:
      label: Release used / 使用したリリース
      placeholder: 例：2026-08-24_02-26-JST

  - type: textarea
    id: symptom
    attributes:
      label: What happened? / 何が起きましたか？
      description: Describe what you saw and what you expected. / 実際の挙動と期待した結果を書いてください。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: |
        1. APKをインストール
        2. アプリを起動
        3. ○○を操作するとクラッシュ

  - type: textarea
    id: environment
    attributes:
      label: Device and Android version / 端末・Android環境
      placeholder: 例：Pixel 8 / Android 15 / rootなし

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / ログ・スクリーンショット
      description: Attach relevant, redacted images or logs. Do not include account details or secrets. / 関連する画像やログを添付できます。アカウント情報や秘密情報は含めないでください。
