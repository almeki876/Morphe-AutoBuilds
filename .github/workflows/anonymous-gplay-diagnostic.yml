name: Anonymous Google Play Diagnostic

on:
  push:
    branches:
      - chatgpt/anonymous-google-play
    paths:
      - .github/workflows/anonymous-gplay-diagnostic.yml
      - requirements.txt
      - src/aurora_play.py
      - src/apk_identity.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/anonymous-gplay-diagnostic.yml
      - requirements.txt
      - src/aurora_play.py
      - src/apk_identity.py

permissions:
  contents: read

jobs:
  anonymous-google-play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Download and verify Yuucho directly from Google Play anonymously
        env:
          GPLAYDL_API_KEY: ''
          GPLAYDL_NO_BANNER: '1'
          GPLAY_ARCH: arm64
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tempfile
          import zipfile

          from src import apk_identity, aurora_play

          package = 'jp.japanpost.jp_bank.bankbookapp'
          with tempfile.TemporaryDirectory(prefix='anonymous-gplay-check-') as tmp:
              result = aurora_play.download_current(package, Path(tmp))
              print(f'downloaded={result.name} bytes={result.stat().st_size}')

              candidates = []
              if result.suffix == '.apk':
                  candidates = [result]
              else:
                  extract_dir = Path(tmp) / 'extracted'
                  extract_dir.mkdir()
                  with zipfile.ZipFile(result) as archive:
                      archive.extractall(extract_dir)
                  candidates = list(extract_dir.rglob('*.apk'))

              if not candidates:
                  raise SystemExit('anonymous Google Play download produced no APKs')

              identities = []
              for apk in candidates:
                  try:
                      identity = apk_identity.read_identity(apk)
                  except Exception:
                      continue
                  identities.append(identity)
                  if identity.package_name == package:
                      print(
                          'verified_google_play_download '
                          f'package={identity.package_name} '
                          f'versionName={identity.version_name} '
                          f'versionCode={identity.version_code}'
                      )
                      break
              else:
                  raise SystemExit(
                      'download completed but no APK matched expected package; '
                      f'identities={[item.package_name for item in identities]}'
                  )
          PY
