name: "自動: VirusTotalキャッシュを保存"

on:
  workflow_run:
    workflows: ["Build and Release APKs"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-cache:
    name: Persist VirusTotal SHA cache
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download VirusTotal report artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p vt-report
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name virustotal-report \
            --dir vt-report

      - name: Extract portable SHA cache
        run: >-
          python3 scripts/export_virustotal_cache.py
          vt-report/virustotal_base_results.json
          virustotal-cache-v1.json

      - name: Attach cache to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh release view \
            --repo "${{ github.repository }}" \
            --json tagName \
            --jq .tagName)
          test -n "$release_tag"
          gh release upload "$release_tag" virustotal-cache-v1.json \
            --repo "${{ github.repository }}" \
            --clobber
          echo "Published VirusTotal cache to release $release_tag"
