name: Build and Release APKs

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build_all_sources:
        description: 'Build every enabled app/source entry'
        required: false
        default: 'false'
      updated_sources:
        description: 'Comma-separated patch source ids to build'
        required: false
        default: ''
      updated_apps:
        description: 'Comma-separated apps whose base APK changed'
        required: false
        default: ''
      apk_updated_apps:
        description: 'JSON array of apps whose base APK changed (diagnostics)'
        required: false
        default: '[]'

jobs:
  download-tools:
    name: Download Build Tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Repository Configuration
        run: python3 scripts/validate_repository.py

      - name: Compute Tool Cache Key
        id: cache-key
        env:
          UPDATED_SOURCES: ${{ github.event.inputs.updated_sources }}
          BUILD_ALL_SOURCES: ${{ github.event.inputs.build_all_sources }}
        run: |
          file_hash="${{ hashFiles('my-patch-config.json', 'sources/**', 'scripts/download_all_tools.py') }}"
          # A source update means a sources/*.json entry can still say "latest".
          # Bust the exact cache for that run so a newly published bundle is never
          # hidden behind an older cache entry. Manual full builds do the same.
          nonce="stable"
          if [ -n "$UPDATED_SOURCES" ] || [ "$BUILD_ALL_SOURCES" = "true" ]; then
            nonce="${{ github.run_id }}"
          fi
          echo "cache-key=build-tools-${file_hash}-${nonce}" >> "$GITHUB_OUTPUT"

      - name: Restore Cached Tools
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: tools/
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Setup Python
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download All Declared Source Tools
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt -q
          python3 scripts/download_all_tools.py

      - name: Save Cached Tools
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/
          key: ${{ steps.cache-key.outputs.cache-key }}

  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    needs: [download-tools]
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Patch Config
        id: read-matrix
        env:
          BUILD_ALL_SOURCES: ${{ github.event.inputs.build_all_sources }}
          UPDATED_SOURCES: ${{ github.event.inputs.updated_sources }}
          UPDATED_APPS: ${{ github.event.inputs.updated_apps }}
        run: python3 scripts/prepare_matrix.py

  download-apks:
    name: Download ${{ matrix.app_name }} base APK
    needs: [download-tools, prepare-matrix]
    if: ${{ needs.prepare-matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Cached Tools
        uses: actions/cache/restore@v6
        with:
          path: tools/
          key: ${{ needs.download-tools.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install apkeep
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu" -o "$HOME/.local/bin/apkeep"
          chmod +x "$HOME/.local/bin/apkeep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download Base APK
        id: download-apk
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
          GPLAY_AUTH_TOKEN: ${{ secrets.GPLAY_AUTH_TOKEN }}
          GPLAY_DISPENSER_URLS: ${{ vars.GPLAY_DISPENSER_URLS }}
          GPLAY_DISPENSER_URL: ${{ vars.GPLAY_DISPENSER_URL }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          AURORA_DISPENSER_URL: ${{ vars.AURORA_DISPENSER_URL }}
          HTTP_RETRIES: '4'
          HTTP_RETRY_BASE_SECONDS: '5'
          HTTP_RETRY_MAX_SECONDS: '60'
          APK_VERSION_CANDIDATES: '5'
          APKMIRROR_REQUEST_INTERVAL_SECONDS: '3.5'
          BASE_APK_CACHE: 'true'
          BASE_APK_CACHE_TAG: 'base-apk-cache-v2'
          BASE_APK_CACHE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/download_apks.py 2>&1 | tee download.log
          exit ${PIPESTATUS[0]}

      - name: Record Download Result
        if: always()
        run: |
          mkdir -p download-status
          {
            echo "app=${{ matrix.app_name }}"
            echo "source=${{ matrix.source }}"
            echo "source_name=${{ matrix.source_label }}"
            echo "phase=Download"
            echo "status=${{ steps.download-apk.outcome }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "traceback_or_error_tail<<EOF"
            if [ -f download.log ]; then tail -n 120 download.log; else echo "Download step did not start."; fi
            echo "EOF"
          } > "download-status/${{ matrix.app_name }}-${{ matrix.source }}-download.txt"
          cat "download-status/${{ matrix.app_name }}-${{ matrix.source }}-download.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Download Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: download-status-${{ matrix.app_name }}-${{ matrix.source }}
          path: download-status/*.txt
          retention-days: 7

      - name: Upload Base APK Input
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: base-input-${{ matrix.app_name }}-${{ matrix.source }}
          path: |
            base-apk-input/*
            build-metadata/apk-sources.json
          retention-days: 1

      - name: Upload Unmodified Base APK for VirusTotal
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: base-scan-${{ matrix.app_name }}-${{ matrix.source }}
          path: base-apk-scan-out/*
          retention-days: 1

  scan-base-apks:
    name: Scan Base APKs with VirusTotal
    needs: [download-apks]
    if: ${{ !cancelled() && needs.download-apks.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download Unmodified Base APKs
        uses: actions/download-artifact@v8
        with:
          path: ./base-apks
          pattern: base-scan-*
          merge-multiple: true

      - name: Scan Unmodified Base APKs with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_WORKERS: '32'
          VT_REQUEST_INTERVAL_SECONDS: '8'
          VT_POLL_INTERVAL_SECONDS: '30'
          VT_ANALYSIS_TIMEOUT_SECONDS: '2700'
          VT_MAX_RETRIES: '6'
          VT_MAX_ANALYSIS_AGE_DAYS: '90'
        run: |
          pip install -r requirements.txt
          python3 -m scripts.scan_virustotal \
            --directory ./base-apks \
            --title "VirusTotal base APK scan results (before patching)" \
            --markdown ./virustotal_base_results.md \
            --json ./virustotal_base_results.json

      - name: Upload VirusTotal Report
        if: always() && hashFiles('virustotal_base_results.*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-report
          path: |
            virustotal_base_results.md
            virustotal_base_results.json
          retention-days: 30

  build-apps:
    name: Build ${{ matrix.app_name }} with ${{ matrix.source_label }}
    needs: [download-tools, prepare-matrix, download-apks]
    if: ${{ needs.prepare-matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Cached Tools
        uses: actions/cache/restore@v6
        with:
          path: tools/
          key: ${{ needs.download-tools.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download APK Input Artifact
        uses: actions/download-artifact@v8
        with:
          name: base-input-${{ matrix.app_name }}-${{ matrix.source }}
          path: .

      - name: Resolve Pre-downloaded APK
        run: |
          apk_path=$(find ./base-apk-input -type f \( -name '*.apk' -o -name '*.apkm' -o -name '*.apks' -o -name '*.xapk' \) -print -quit)
          if [ -z "$apk_path" ]; then
            echo "::error::No pre-downloaded APK input was found."
            exit 1
          fi
          version=$(python3 -c 'import json; print(json.load(open("./base-apk-input/manifest.json"))["version"])')
          echo "PRE_DOWNLOADED_APK=$apk_path" >> "$GITHUB_ENV"
          echo "PRE_DOWNLOADED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build APK
        id: build-apk
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m src 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Record Build Result
        if: always()
        run: |
          mkdir -p build-status
          {
            echo "app=${{ matrix.app_name }}"
            echo "source=${{ matrix.source }}"
            echo "source_name=${{ matrix.source_label }}"
            echo "phase=Patch"
            echo "status=${{ steps.build-apk.outcome }}"
            echo "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "traceback_or_error_tail<<EOF"
            if [ -f build.log ]; then tail -n 100 build.log; else echo "Build step did not start."; fi
            echo "EOF"
          } > "build-status/${{ matrix.app_name }}-${{ matrix.source }}-build.txt"
          if [ -f build-metadata/build-report.json ]; then
            cp build-metadata/build-report.json "build-status/${{ matrix.app_name }}-${{ matrix.source }}.json"
          fi
          cat "build-status/${{ matrix.app_name }}-${{ matrix.source }}-build.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-status-${{ matrix.app_name }}-${{ matrix.source }}
          path: build-status/*
          retention-days: 7

      - name: Upload Verified Base APK Cache Candidate
        if: success() && hashFiles('base-apk-cache-out/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: base-apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: base-apk-cache-out/*
          retention-days: 1

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: |
            *.apk
            build-metadata/apk-sources.json

  report-build-failures:
    name: Report Per-App Build Failures
    needs: [prepare-matrix, download-apks, build-apps]
    if: ${{ always() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Download Failure Results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: failure-results
          pattern: '*-status-*'
          merge-multiple: true
      - name: Create or Update App Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/report_build_failure.py --directory failure-results

  update-base-apk-cache:
    name: Update Base APK Cache
    needs: [build-apps]
    if: ${{ !cancelled() && needs.build-apps.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download Cache Candidates
        id: candidates
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: base-apk-cache-in
          pattern: base-apk-*
          merge-multiple: true
      - name: Update Hidden Durable Cache
        if: steps.candidates.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_APK_CACHE_TAG: 'base-apk-cache-v2'
          BASE_APK_CACHE_KEEP: '10'
        run: |
          pip install -r requirements.txt
          python3 -m scripts.update_base_apk_cache

  create-release:
    name: Create Integrated Release
    needs: [prepare-matrix, build-apps, scan-base-apks]
    if: >-
      ${{
        !cancelled() &&
        needs.prepare-matrix.outputs.matrix != '[]' &&
        needs.build-apps.result != 'skipped' &&
        needs.scan-base-apks.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download APK Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./all-apks
          pattern: apk-*
      - name: Download Build Results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: ./build-results
          pattern: build-status-*
          merge-multiple: true
      - name: Download VirusTotal Report
        uses: actions/download-artifact@v8
        with:
          path: .
          name: virustotal-report
      - name: Collect APKs and Validate Release
        id: release-state
        env:
          EXPECTED_MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          mkdir -p ./release-apks
          find ./all-apks -name '*.apk' -exec cp {} ./release-apks/ \; 2>/dev/null || true
          total=$(find ./release-apks -name '*.apk' | wc -l)
          if [ "$total" -eq 0 ]; then
            echo "::error::No APK artifacts were produced."
            exit 1
          fi
          failed_count=0
          if [ -d ./build-results ]; then
            failed_count=$(grep -R -l '^status=failure$' ./build-results/*.txt 2>/dev/null | wc -l || true)
          fi
          echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"
          python3 -m scripts.release_metadata
      - name: Generate Release Tag
        id: tag
        run: |
          tag=$(TZ=Asia/Tokyo date +'%Y-%m-%d_%H-%M-JST')
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate Release Notes
        run: python3 -m scripts.release_notes
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ steps.tag.outputs.release_tag }}"
          title="Morphe AutoBuilds $release_tag"
          if [ "${{ steps.release-state.outputs.failed_count }}" -gt 0 ]; then
            title="$title (Partial)"
          fi
          gh release create "$release_tag" --title "$title" --notes-file release_notes.md
          find ./release-apks -name '*.apk' -print0 | xargs -0 -r -P 8 -I {} gh release upload "$release_tag" "{}"

  report-partial-patch-failures:
    name: Report Partial Patch Failures
    needs: [build-apps, create-release]
    if: ${{ needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Download Build Results
        uses: actions/download-artifact@v8
        with:
          path: partial-results
          pattern: build-status-*
          merge-multiple: true
      - name: Create Partial Patch Failure Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/report_build_failure.py --directory partial-results --partial-only

  persist-successful-state:
    name: Persist Successful Upstream State
    needs: [build-apps, create-release]
    if: ${{ !cancelled() && needs.build-apps.result == 'success' && needs.create-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Download Build Results
        uses: actions/download-artifact@v8
        with:
          path: ./build-results
          pattern: build-status-*
          merge-multiple: true
      - name: Refuse Partial State Persistence
        run: |
          if [ ! -d ./build-results ] || ! find ./build-results -name '*.txt' -print -quit | grep -q .; then
            echo "::error::Per-app build results are missing."
            exit 1
          fi
          if grep -R -E '^status=(failure|cancelled|skipped)$' ./build-results; then
            echo "::error::At least one build failed; not advancing state."
            exit 1
          fi
      - name: Save Resolved Patch and APK Versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt
          python3 scripts/save_successful_state.py
      - name: Commit State When Changed
        run: |
          if git diff --quiet -- last-tags.json; then
            echo "State already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- last-tags.json
          git commit -m "chore: record successful build state [skip ci]"
          git push

  handle-build-failure:
    name: Open or Update Workflow Failure Issue
    needs: [download-tools, prepare-matrix, download-apks, build-apps, create-release, report-build-failures]
    if: >-
      ${{
        always() &&
        needs.prepare-matrix.outputs.matrix != '[]' &&
        needs.report-build-failures.result != 'success' &&
        (needs.download-tools.result == 'failure' ||
         needs.prepare-matrix.result == 'failure' ||
         needs.download-apks.result == 'failure' ||
         needs.build-apps.result == 'failure' ||
         needs.create-release.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or Update Failure Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOOLS_RESULT: ${{ needs.download-tools.result }}
          MATRIX_RESULT: ${{ needs.prepare-matrix.result }}
          DOWNLOAD_RESULT: ${{ needs.download-apks.result }}
          BUILD_RESULT: ${{ needs.build-apps.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
        run: |
          title="Automated APK build workflow failed"
          cat > build-failure-issue.md <<EOF
          # Automated APK Build Failure Report

          - **Download Tools:** ${TOOLS_RESULT}
          - **Prepare Matrix:** ${MATRIX_RESULT}
          - **Download APKs:** ${DOWNLOAD_RESULT}
          - **Build Apps:** ${BUILD_RESULT}
          - **Create Release:** ${RELEASE_RESULT}
          - **Workflow Run:** ${RUN_URL}
          EOF
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file build-failure-issue.md
          else
            gh issue create --title "$title" --body-file build-failure-issue.md --label bug
          fi
