name: Build and Release APKs

# 同時に複数回このワークフローが走ると、download-tools ジョブが同じ
# キャッシュキーを取り合って "Unable to reserve cache" 警告が出る
# （実害は小さいが、無駄な再ダウンロードや紛らわしいログの原因になる）。
# 新しい実行が来たら前の実行をキャンセルして直列化する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      morphe_tag:
        description: 'Morphe (Official) tag'
        required: false
        default: 'latest'
      anddea_tag:
        description: 'Anddea tag'
        required: false
        default: 'latest'
      rushiranpise_tag:
        description: 'rushiranpise tag'
        required: false
        default: 'latest'
      rookie_tag:
        description: 'RookieEnough tag'
        required: false
        default: 'latest'
      tosox_tag:
        description: 'Tosox tag'
        required: false
        default: 'latest'
      yuzu_tag:
        description: 'YuzuMikan404 tag'
        required: false
        default: 'latest'
      dropped_tag:
        description: 'Dropped-Patches tag'
        required: false
        default: 'latest'
      morphe_updated:
        description: 'Whether Morphe (Official) was updated'
        required: false
        default: 'false'
      anddea_updated:
        description: 'Whether Anddea was updated'
        required: false
        default: 'false'
      rushiranpise_updated:
        description: 'Whether rushiranpise was updated'
        required: false
        default: 'false'
      rookie_updated:
        description: 'Whether RookieEnough was updated'
        required: false
        default: 'false'
      tosox_updated:
        description: 'Whether Tosox was updated'
        required: false
        default: 'false'
      yuzu_updated:
        description: 'Whether YuzuMikan404 was updated'
        required: false
        default: 'false'
      dropped_updated:
        description: 'Whether Dropped-Patches was updated'
        required: false
        default: 'false'
      morphe_force_build:
        description: 'Force build Morphe due to APK update (no NEW badge)'
        required: false
        default: 'false'
      anddea_force_build:
        description: 'Force build Anddea due to APK update (no NEW badge)'
        required: false
        default: 'false'
      rushiranpise_force_build:
        description: 'Force build rushiranpise due to APK update (no NEW badge)'
        required: false
        default: 'false'
      rookie_force_build:
        description: 'Force build RookieEnough due to APK update (no NEW badge)'
        required: false
        default: 'false'
      tosox_force_build:
        description: 'Force build Tosox due to APK update (no NEW badge)'
        required: false
        default: 'false'
      yuzu_force_build:
        description: 'Force build YuzuMikan404 due to APK update (no NEW badge)'
        required: false
        default: 'false'
      dropped_force_build:
        description: 'Force build Dropped-Patches due to APK update (no NEW badge)'
        required: false
        default: 'false'
      apk_updated_apps:
        description: 'JSON array of apps whose APK was updated'
        required: false
        default: '[]'

jobs:
  download-tools:
    name: Download Build Tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.resolve-tags.outputs.cache-key }}
      morphe_resolved:  ${{ steps.resolve-tags.outputs.morphe_resolved }}
      anddea_resolved:  ${{ steps.resolve-tags.outputs.anddea_resolved }}
      rushiranpise_resolved: ${{ steps.resolve-tags.outputs.rushiranpise_resolved }}
      rookie_resolved:  ${{ steps.resolve-tags.outputs.rookie_resolved }}
      tosox_resolved:   ${{ steps.resolve-tags.outputs.tosox_resolved }}
      yuzu_resolved:    ${{ steps.resolve-tags.outputs.yuzu_resolved }}
      dropped_resolved: ${{ steps.resolve-tags.outputs.dropped_resolved }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Repository Configuration
        run: python3 scripts/validate_repository.py

      # ---------------------------------------------------------------
      # 1. 各ソースの実際のパッチバージョンを確定させる
      #    "latest" が渡された場合はプレリリースを含む最新1件を解決する。
      #    解決済みのタグをキャッシュキーに組み込むことで、
      #    パッチが更新されるたびに必ずキャッシュミスが発生し
      #    古いパッチが再利用されることを防ぐ。
      # ---------------------------------------------------------------
      - name: Resolve Patch Tags and Compute Cache Key
        id: resolve-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # プレリリースを含む全リリースから最新1件のタグを返す
          resolve_tag() {
            local repo="$1" hint="$2"
            if [ -n "$hint" ] && [ "$hint" != "latest" ]; then
              echo "$hint"
              return
            fi
            gh api "repos/${repo}/releases?per_page=100" \
              --jq 'sort_by(.published_at) | reverse | .[0].tag_name' \
              2>/dev/null || echo "unknown"
          }

          morphe_resolved=$(resolve_tag  "MorpheApp/morphe-patches"          "${{ github.event.inputs.morphe_tag }}")
          anddea_resolved=$(resolve_tag  "anddea/revanced-patches"            "${{ github.event.inputs.anddea_tag }}")
          rushiranpise_resolved=$(resolve_tag "rushiranpise/morphe-patches" "${{ github.event.inputs.rushiranpise_tag }}")
          rookie_resolved=$(resolve_tag  "RookieEnough/De-Vanced"              "${{ github.event.inputs.rookie_tag }}")
          tosox_resolved=$(resolve_tag   "Tosox/revanced-patches"             "${{ github.event.inputs.tosox_tag }}")
          yuzu_resolved="patche"  # 固定リリースタグ (matchadaisuke/morphe-patches)
          dropped_resolved=$(resolve_tag "indrastorms/Dropped-Patches"        "${{ github.event.inputs.dropped_tag }}")

          echo "morphe_resolved=$morphe_resolved"   >> $GITHUB_OUTPUT
          echo "anddea_resolved=$anddea_resolved"   >> $GITHUB_OUTPUT
          echo "rushiranpise_resolved=$rushiranpise_resolved" >> $GITHUB_OUTPUT
          echo "rookie_resolved=$rookie_resolved"   >> $GITHUB_OUTPUT
          echo "tosox_resolved=$tosox_resolved"     >> $GITHUB_OUTPUT
          echo "yuzu_resolved=$yuzu_resolved"       >> $GITHUB_OUTPUT
          echo "dropped_resolved=$dropped_resolved" >> $GITHUB_OUTPUT

          # キャッシュキー = ファイルハッシュ + 全パッチバージョンの結合
          # パッチが1つでも変わればキャッシュミスになる
          version_string="${morphe_resolved}__${anddea_resolved}__${rushiranpise_resolved}__${rookie_resolved}__${tosox_resolved}__${yuzu_resolved}__${dropped_resolved}"
          file_hash="${{ hashFiles('my-patch-config.json', 'arch-config.json', 'sources/**') }}"
          cache_key="build-tools-${file_hash}-${version_string}"
          echo "cache-key=${cache_key}" >> $GITHUB_OUTPUT

          echo "Resolved tags:"
          echo "  morphe:  $morphe_resolved"
          echo "  anddea:  $anddea_resolved"
          echo "  rushiranpise: $rushiranpise_resolved"
          echo "  rookie:  $rookie_resolved"
          echo "  tosox:   $tosox_resolved"
          echo "  yuzu:    $yuzu_resolved"
          echo "  dropped: $dropped_resolved"
          echo "Cache key: ${cache_key}"

      # ---------------------------------------------------------------
      # 2. キャッシュを先に確認する（ヒットすればダウンロードをスキップ）
      # ---------------------------------------------------------------
      - name: Restore Cached Tools
        id: cache-restore
        # Restore専用Actionを使う。actions/cacheの通常Actionはpost処理で自動保存するため、
        # 下の明示的なcache/saveと二重保存になり、reserve競合を起こす。
        uses: actions/cache/restore@v6
        with:
          path: tools/
          key: ${{ steps.resolve-tags.outputs.cache-key }}

      # ---------------------------------------------------------------
      # 3. キャッシュミス時のみダウンロードする
      #    解決済みタグを SOURCE_TAG_* として渡すことで
      #    download_all_tools.py が正しいバージョンを取得する
      # ---------------------------------------------------------------
      - name: Setup Python
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Download All Source Tools
        if: steps.cache-restore.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPD_MORPHE:   ${{ github.event.inputs.morphe_updated }}
          UPD_ANDDEA:   ${{ github.event.inputs.anddea_updated }}
          UPD_RUSHIRANPISE: ${{ github.event.inputs.rushiranpise_updated }}
          UPD_ROOKIE:   ${{ github.event.inputs.rookie_updated }}
          UPD_TOSOX:    ${{ github.event.inputs.tosox_updated }}
          UPD_YUZU:     ${{ github.event.inputs.yuzu_updated }}
          UPD_DROPPED:  ${{ github.event.inputs.dropped_updated }}
          # 解決済みの具体的なタグを渡す（"latest" は渡さない）
          SOURCE_TAG_MORPHE:          ${{ steps.resolve-tags.outputs.morphe_resolved }}
          SOURCE_TAG_ANDDEA:          ${{ steps.resolve-tags.outputs.anddea_resolved }}
          SOURCE_TAG_REVANCED_ANDDEA: ${{ steps.resolve-tags.outputs.anddea_resolved }}
          SOURCE_TAG_RUSHIRANPISE:    ${{ steps.resolve-tags.outputs.rushiranpise_resolved }}
          SOURCE_TAG_ROOKIE:          ${{ steps.resolve-tags.outputs.rookie_resolved }}
          SOURCE_TAG_TOSOX:           ${{ steps.resolve-tags.outputs.tosox_resolved }}
          SOURCE_TAG_YUZU:            ${{ steps.resolve-tags.outputs.yuzu_resolved }}
          PAT:                        ${{ secrets.PAT }}
          SOURCE_TAG_DROPPED:         ${{ steps.resolve-tags.outputs.dropped_resolved }}
        run: |
          pip install -r requirements.txt -q
          python3 scripts/download_all_tools.py

      # ---------------------------------------------------------------
      # 4. ダウンロード済みの tools/ をキャッシュに保存する
      #    キャッシュミス時のみ保存が走る（actions/cache の仕様）
      # ---------------------------------------------------------------
      - name: Save Cached Tools
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/
          key: ${{ steps.resolve-tags.outputs.cache-key }}

  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    # download-tools の後に実行することで、同一リポジトリへの並列 checkout を防ぐ。
    # 並列 checkout は GitHub の secondary rate limit を引き起こし
    # "Your account is suspended" エラーの原因になる。
    needs: [download-tools]
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Patch Config and Filter by Updated Sources
        id: read-matrix
        env:
          UPD_MORPHE:   ${{ github.event.inputs.morphe_updated }}
          UPD_ANDDEA:   ${{ github.event.inputs.anddea_updated }}
          UPD_RUSHIRANPISE: ${{ github.event.inputs.rushiranpise_updated }}
          UPD_ROOKIE:   ${{ github.event.inputs.rookie_updated }}
          UPD_TOSOX:    ${{ github.event.inputs.tosox_updated }}
          UPD_YUZU:     ${{ github.event.inputs.yuzu_updated }}
          UPD_DROPPED:  ${{ github.event.inputs.dropped_updated }}
          FORCE_MORPHE:  ${{ github.event.inputs.morphe_force_build }}
          FORCE_ANDDEA:  ${{ github.event.inputs.anddea_force_build }}
          FORCE_RUSHIRANPISE: ${{ github.event.inputs.rushiranpise_force_build }}
          FORCE_ROOKIE:  ${{ github.event.inputs.rookie_force_build }}
          FORCE_TOSOX:   ${{ github.event.inputs.tosox_force_build }}
          FORCE_YUZU:    ${{ github.event.inputs.yuzu_force_build }}
          FORCE_DROPPED: ${{ github.event.inputs.dropped_force_build }}
          APK_UPDATED_APPS: ${{ github.event.inputs.apk_updated_apps }}
        run: |
          # env: + run: is valid; env: + uses: is not (Actions parser error).
          python3 scripts/prepare_matrix.py

  build-apps:
    name: Build ${{ matrix.app_name }} with ${{ matrix.source_label }}
    needs: [download-tools, prepare-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # APK配布サイトへの同時アクセスを抑え、403/429/503を避ける。
      # 21ジョブの一斉実行は各サイトのレート制限を誘発した実績がある。
      max-parallel: 2
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore Cached Tools
        uses: actions/cache/restore@v6
        with:
          path: tools/
          key: ${{ needs.download-tools.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      # ReVanced/Morphe CLI jarはclass file version 65 (Java 21)でビルドされている。
      # ubuntu-latestランナーのデフォルトJDKに依存すると、GitHub側やCLI側の
      # 都合でJavaのメジャーバージョンが上がった際に
      # "UnsupportedClassVersionError" で全ビルドが壊れる。明示的に固定する。
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_RETRIES: '4'
          HTTP_RETRY_BASE_SECONDS: '5'
          HTTP_RETRY_MAX_SECONDS: '60'
          APK_VERSION_CANDIDATES: '5'
          APKMIRROR_REQUEST_INTERVAL_SECONDS: '3.5'
          BASE_APK_CACHE: 'true'
          BASE_APK_CACHE_TAG: 'base-apk-cache-v1'
        run: |
          echo "Building ${{ matrix.app_name }} with ${{ matrix.source_label }}..."
          # 同時に開始した2ジョブも配布サイトへ同時着弾しないよう分散する。
          sleep $((15 + RANDOM % 31))
          python3 -m src

      - name: Upload Verified Base APK Cache Candidate
        if: success() && hashFiles('base-apk-cache-out/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: base-apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: base-apk-cache-out/*
          retention-days: 1

      - name: Upload Unmodified Base APK for VirusTotal
        if: success() && hashFiles('base-apk-scan-out/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: base-apk-scan-${{ matrix.app_name }}-${{ matrix.source }}
          path: base-apk-scan-out/*
          retention-days: 1

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: |
            *.apk
            build-metadata/apk-sources.json

  update-base-apk-cache:
    name: Update Base APK Cache
    needs: [build-apps]
    if: ${{ !cancelled() && needs.build-apps.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Download Cache Candidates
        id: candidates
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: base-apk-cache-in
          pattern: base-apk-*
          merge-multiple: true

      - name: Update Hidden Durable Cache
        if: steps.candidates.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_APK_CACHE_TAG: 'base-apk-cache-v1'
          BASE_APK_CACHE_KEEP: '10'
        run: |
          pip install -r requirements.txt
          python3 -m scripts.update_base_apk_cache

  create-release:
    name: Create Integrated Release
    needs: [download-tools, prepare-matrix, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # build-apps の一部失敗時は成功分をリリースできるよう起動するが、
    # ツール取得や matrix 準備の失敗時は成果物が存在し得ないため起動しない。
    if: >-
      ${{
        !cancelled() &&
        needs.download-tools.result == 'success' &&
        needs.prepare-matrix.result == 'success' &&
        needs.build-apps.result != 'skipped'
      }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Download All APK Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./all-apks
          pattern: apk-*


      - name: Collect All APKs
        run: |
          mkdir -p ./release-apks
          echo "Collecting built APKs..."
          [ -d ./all-apks ] && find ./all-apks -name "*.apk" -exec cp {} ./release-apks/ \; || true
          echo "APKs in release-apks:"
          ls -la ./release-apks/ 2>/dev/null || echo "(none)"

      - name: Download Unmodified Base APKs
        uses: actions/download-artifact@v8
        with:
          path: ./base-apks
          pattern: base-apk-scan-*
          merge-multiple: true

      - name: Check if Any APKs Were Built
        id: check-apks
        env:
          EXPECTED_MATRIX: ${{ needs.prepare-matrix.outputs.matrix }}
        run: |
          total=$(find ./release-apks -name "*.apk" 2>/dev/null | wc -l)
          echo "Total APKs built: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No APK artifacts were produced. Refusing to report a successful release job."
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "skip_release=false" >> $GITHUB_OUTPUT
          fi

          python3 -m scripts.release_metadata

      - name: Scan Unmodified Base APKs with VirusTotal
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          # Public APIの上限（4 requests/minute）を超えない間隔。
          VT_REQUEST_INTERVAL_SECONDS: '16'
          VT_POLL_INTERVAL_SECONDS: '30'
          VT_ANALYSIS_TIMEOUT_SECONDS: '2700'
          VT_MAX_RETRIES: '6'
        run: |
          pip install -r requirements.txt
          python3 -m scripts.scan_virustotal \
            --directory ./base-apks \
            --title "VirusTotal base APK scan results (before patching)" \
            --markdown ./virustotal_base_results.md \
            --json ./virustotal_base_results.json

      - name: Preserve VirusTotal Report
        if: always() && hashFiles('virustotal_base_results.*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-report
          path: |
            virustotal_base_results.md
            virustotal_base_results.json
          retention-days: 30

      - name: Add VirusTotal Report to Job Summary
        if: always() && hashFiles('virustotal_base_results.md') != ''
        run: |
          [ -f virustotal_base_results.md ] && cat virustotal_base_results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Release Tag (JST)
        if: steps.check-apks.outputs.skip_release == 'false'
        id: tag
        run: |
          jst_time=$(TZ=Asia/Tokyo date +'%Y-%m-%d_%H-%M-JST')
          echo "release_tag=$jst_time" >> $GITHUB_OUTPUT
          echo "Release tag: $jst_time"

      - name: Generate Release Notes
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          MORPHE_TAG: ${{ needs.download-tools.outputs.morphe_resolved }}
          ANDDEA_TAG: ${{ needs.download-tools.outputs.anddea_resolved }}
          RUSHIRANPISE_TAG: ${{ needs.download-tools.outputs.rushiranpise_resolved }}
          ROOKIE_TAG: ${{ needs.download-tools.outputs.rookie_resolved }}
          TOSOX_TAG: ${{ needs.download-tools.outputs.tosox_resolved }}
          YUZU_TAG: ${{ needs.download-tools.outputs.yuzu_resolved }}
          DROPPED_TAG: ${{ needs.download-tools.outputs.dropped_resolved }}
          MORPHE_UPDATED: ${{ github.event.inputs.morphe_updated }}
          ANDDEA_UPDATED: ${{ github.event.inputs.anddea_updated }}
          RUSHIRANPISE_UPDATED: ${{ github.event.inputs.rushiranpise_updated }}
          ROOKIE_UPDATED: ${{ github.event.inputs.rookie_updated }}
          TOSOX_UPDATED: ${{ github.event.inputs.tosox_updated }}
          YUZU_UPDATED: ${{ github.event.inputs.yuzu_updated }}
          DROPPED_UPDATED: ${{ github.event.inputs.dropped_updated }}
          MORPHE_FORCE: ${{ github.event.inputs.morphe_force_build }}
          ANDDEA_FORCE: ${{ github.event.inputs.anddea_force_build }}
          RUSHIRANPISE_FORCE: ${{ github.event.inputs.rushiranpise_force_build }}
          ROOKIE_FORCE: ${{ github.event.inputs.rookie_force_build }}
          TOSOX_FORCE: ${{ github.event.inputs.tosox_force_build }}
          YUZU_FORCE: ${{ github.event.inputs.yuzu_force_build }}
          DROPPED_FORCE: ${{ github.event.inputs.dropped_force_build }}
        run: |
          python3 -m scripts.release_notes

      - name: Create Release
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ steps.tag.outputs.release_tag }}"
          failed_count="${{ steps.check-apks.outputs.failed_count }}"
          release_title="Morphe AutoBuilds $release_tag"
          if [ "${failed_count:-0}" -gt 0 ]; then
            release_title="$release_title (Partial)"
          fi

          echo "Creating release: $release_tag"

          # Delete existing release/tag with the same name if it exists, then recreate
          gh release delete "$release_tag" --yes 2>/dev/null || true
          git push --delete origin "refs/tags/$release_tag" 2>/dev/null || true

          gh release create "$release_tag" \
            --title "$release_title" \
            --notes-file release_notes.md \
            ./release-apks/*.apk

          echo "Release created successfully!"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$release_tag"

      - name: Display Release Summary
        if: steps.check-apks.outputs.skip_release == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${{ steps.tag.outputs.release_tag }}"

          echo "Release Summary:"
          echo "  Tag: $release_tag"
          echo "  APKs:"
          ls -1 ./release-apks/*.apk | sed 's/^/    - /'
          echo ""
          echo "Download: https://github.com/${{ github.repository }}/releases/tag/$release_tag"

  persist-successful-state:
    name: Persist Successful Upstream State
    needs: [download-tools, build-apps, create-release]
    if: >-
      ${{
        !cancelled() &&
        needs.build-apps.result == 'success' &&
        needs.create-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Save Resolved Patch and APK Versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG_MORPHE: ${{ needs.download-tools.outputs.morphe_resolved }}
          SOURCE_TAG_ANDDEA: ${{ needs.download-tools.outputs.anddea_resolved }}
          SOURCE_TAG_RUSHIRANPISE: ${{ needs.download-tools.outputs.rushiranpise_resolved }}
          SOURCE_TAG_ROOKIE: ${{ needs.download-tools.outputs.rookie_resolved }}
          SOURCE_TAG_TOSOX: ${{ needs.download-tools.outputs.tosox_resolved }}
          SOURCE_TAG_YUZU: ${{ needs.download-tools.outputs.yuzu_resolved }}
          SOURCE_TAG_DROPPED: ${{ needs.download-tools.outputs.dropped_resolved }}
        run: |
          pip install -r requirements.txt
          python3 scripts/save_successful_state.py

      - name: Commit State When Changed
        run: |
          if git diff --quiet -- last-tags.json; then
            echo "State already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- last-tags.json
          git commit -m "chore: record successful build state [skip ci]"
          git push

  handle-build-failure:
    name: Open or Update Build Failure Issue
    needs: [download-tools, prepare-matrix, build-apps, create-release]
    if: >-
      ${{
        always() &&
        (needs.download-tools.result == 'failure' ||
         needs.prepare-matrix.result == 'failure' ||
         needs.build-apps.result == 'failure' ||
         needs.create-release.result == 'failure')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or Update Failure Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TOOLS_RESULT: ${{ needs.download-tools.result }}
          MATRIX_RESULT: ${{ needs.prepare-matrix.result }}
          BUILD_RESULT: ${{ needs.build-apps.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
        run: |
          title="Automated APK build workflow failed"
          cat <<EOF > build-failure-issue.md
          # Automated APK Build Failure Report

          An error occurred during the APK build and release workflow run.

          ## Job Status Summary
          - **Download Tools**: ${TOOLS_RESULT}
          - **Prepare Matrix**: ${MATRIX_RESULT}
          - **Build Apps**: ${BUILD_RESULT}
          - **Create Release**: ${RELEASE_RESULT}

          **Workflow Run**: ${RUN_URL}
          EOF

          issue=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file build-failure-issue.md
          else
            gh issue create --title "$title" --body-file build-failure-issue.md --label "bug"
          fi

