name: "TEMP: Audit VT migration"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_audit-vt-migration.yml

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Capture migration history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('runs.json').read_text())
          runs=[r for r in p.get('workflow_runs',[]) if r.get('path')=='.github/workflows/_integrate-vt-cache-into-release.yml']
          lines=['# TEMP VT migration audit','']
          for r in runs[:5]:
              lines.append(f"- run `{r['id']}` #{r['run_number']}: `{r.get('status')}` / `{r.get('conclusion')}` — {r.get('html_url')}")
          Path('audit.md').write_text('\n'.join(lines)+'\n')
          PY
          title='TEMP VT migration audit'
          old=$(gh issue list --state all --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$old" ]; then gh issue edit "$old" --body-file audit.md; gh issue reopen "$old" 2>/dev/null || true; else gh issue create --title "$title" --body-file audit.md; fi
      - name: Remove auditor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_audit-vt-migration.yml
          git commit -m 'chore: remove VT migration auditor [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
