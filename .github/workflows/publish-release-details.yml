name: "保守: Release詳細を再生成"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to rebuild details for'
        required: true
        type: string
      run_id:
        description: 'Build and Release APKs run ID whose artifacts should be used'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-details-recovery-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate requested Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null

      - name: Download build result artifacts
        uses: actions/download-artifact@v8
        with:
          path: details-input/build
          pattern: build-status-*
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download download result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: details-input/download
          pattern: download-status-*
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download shared base APK provenance artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: details-input/base
          pattern: base-input-*
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download VirusTotal report
        uses: actions/download-artifact@v8
        with:
          path: .
          name: virustotal-report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download source Actions log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p details-input
          gh run view "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --log > details-input/actions.log
          test -s details-input/actions.log

      - name: Verify integrated Gboard patch results
        run: python3 scripts/validate_release_details.py

      - name: Generate persistent Release details
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
        run: python3 scripts/generate_release_details.py

      - name: Append runtime skipped patch evidence
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/append_release_skip_details.py \
            --actions-log details-input/actions.log \
            --build-results details-input/build \
            --release-dir "release-details/$RELEASE_TAG"

      - name: Commit repaired detail pages
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "release-details/$RELEASE_TAG"
          if git diff --cached --quiet; then
            echo "Release details are already current."
            exit 0
          fi
          git commit -m "docs: repair build details for $RELEASE_TAG [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Replace Release notes with repaired linked index
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --notes-file release-notes-details.md
