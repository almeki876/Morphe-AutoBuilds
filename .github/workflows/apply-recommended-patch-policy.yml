name: Apply recommended patch policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/recommended-patches-normal-behavior'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v7
        with:
          ref: fix/recommended-patches-normal-behavior

      - name: Apply policy changes
        run: |
          python3 tmp_apply_recommended_policy.py
          python3 -m compileall -q scripts/report_build_failure.py
          python3 -m unittest tests.test_failure_reporting
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('my-patch-config.json').read_text(encoding='utf-8'))
          entry = next(
              item for item in data['patch_list']
              if item.get('app_name') == 'youtube-music'
              and item.get('source') == 'revanced-anddea'
          )
          expected = {
              'Enable compact dialog',
              'Hide handle',
              'Enable smooth transition animation',
              'Restore old comments popup panels',
              'Spoof app version',
          }
          assert expected <= set(entry.get('disable') or [])
          PY

      - name: Commit clean policy changes
        run: |
          git rm .github/workflows/apply-recommended-patch-policy.yml
          git rm tmp_apply_recommended_policy.py
          git rm TEMP_TRIGGER_DO_NOT_MERGE.txt
          git add my-patch-config.json scripts/report_build_failure.py tests/test_failure_reporting.py tests/test_recommended_patch_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: treat recommended unsupported patches as normal"
          git push origin HEAD:fix/recommended-patches-normal-behavior
