name: Finalize Successful Build

on:
  workflow_run:
    workflows:
      - Build and Release APKs
    types:
      - completed

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  finalize:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout successful run revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download successful build reports
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p build-results
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --pattern 'build-status-*' \
            --dir build-results

      - name: Close resolved auto-generated issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 scripts/close_resolved_build_issues.py --directory build-results

      - name: Download VirusTotal report from successful build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p vt-report
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name virustotal-report \
            --dir vt-report
          test -s vt-report/virustotal_base_results.json

      - name: Export portable VirusTotal SHA cache
        run: |
          python3 scripts/export_virustotal_cache.py \
            vt-report/virustotal_base_results.json \
            virustotal-cache-v1.json
          test -s virustotal-cache-v1.json

      - name: Resolve Release created by source run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
          RUN_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          release_tag="$(gh api --paginate \
            "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.draft == false and .created_at >= \"$RUN_CREATED\" and .created_at <= \"$RUN_UPDATED\") | .tag_name" \
            | head -n 1)"
          if [ -z "$release_tag" ]; then
            echo "::error::Could not identify the Release created by source run ${{ github.event.workflow_run.id }}."
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Matched Release: $release_tag"

      - name: Attach VirusTotal cache to the matching Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" virustotal-cache-v1.json \
            --repo "${{ github.repository }}" \
            --clobber
          echo "Published VirusTotal cache to $RELEASE_TAG"
