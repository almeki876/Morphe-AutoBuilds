name: Build All Apps

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger-build-all:
    name: Start Full App Build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Build Workflow for All Apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f build_all_sources=true

      - name: Summarize Dispatched Build
        run: |
          {
            echo "## Full App Build Dispatched"
            echo
            echo "Triggered \`build.yml\` on \`main\` with \`build_all_sources=true\`."
            echo "The build includes every enabled app/source entry that is not marked \`skip_build\`."
          } >> "$GITHUB_STEP_SUMMARY"
