name: Build All Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  trigger-build-all:
    name: Start Full App Build
    runs-on: ubuntu-latest
    # Manual runs always dispatch a full build. A push dispatches one only
    # when the head commit message contains the keyword "BuildAllApps"
    # (case-insensitive), e.g. "fix: update patch config BuildAllApps".
    # Pushes without the keyword, and pushes made by the build workflow
    # itself with GITHUB_TOKEN, never start a full build.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'BuildAllApps') }}
    steps:
      - name: Dispatch Build Workflow for All Apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f build_all_sources=true

      - name: Summarize Dispatched Build
        run: |
          {
            echo "## Full App Build Dispatched"
            echo
            echo "Triggered \`build.yml\` on \`main\` with \`build_all_sources=true\`."
            echo "The build includes every enabled app/source entry that is not marked \`skip_build\`."
          } >> "$GITHUB_STEP_SUMMARY"
