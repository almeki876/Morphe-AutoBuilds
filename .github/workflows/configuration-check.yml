name: Configuration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Configuration
        run: python3 scripts/validate_repository.py

      - name: Compile Python Sources
        run: python3 -m compileall -q src scripts

      - name: Compile Google Play Downloader
        run: mvn -q -f tools/gplaydl/pom.xml -DskipTests package

      - name: Import Provider Registry
        run: >-
          python3 -c
          "from src import providers;
          errors = providers.validate_all_configs();
          assert not errors, errors"

      - name: Run Unit Tests
        run: python3 -m unittest discover tests

      - name: Diagnose Uptodown historical download button
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import time
          from urllib.parse import urlparse
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          def safe_url(raw):
              p = urlparse(raw)
              parts = [x for x in p.path.split('/') if x]
              if 'post-download' in parts:
                  i = parts.index('post-download')
                  parts = parts[:i+1] + ['<redacted>']
              if 'dwn' in parts:
                  i = parts.index('dwn')
                  parts = parts[:i+1] + ['<redacted>']
              return f'{p.scheme}://{p.netloc}/' + '/'.join(parts)

          chrome = (shutil.which('google-chrome') or shutil.which('google-chrome-stable')
                    or shutil.which('chromium') or shutil.which('chromium-browser'))
          driver_path = shutil.which('chromedriver')
          if not chrome or not driver_path:
              raise SystemExit(f'Chrome unavailable: chrome={bool(chrome)} driver={bool(driver_path)}')
          options = Options(); options.binary_location = chrome
          for arg in ('--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
                      '--disable-gpu', '--window-size=1365,1600', '--lang=en-US'):
              options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'performance': 'ALL'})
          browser = webdriver.Chrome(service=Service(driver_path), options=options)
          browser.set_page_load_timeout(30)
          try:
              browser.get('https://amazon-shopping.en.uptodown.com/android/versions')
              time.sleep(1.5)
              clicked = browser.execute_script(r'''
          for (const card of document.querySelectorAll('[data-version-id]')) {
            if (!String(card.innerText||card.textContent||'').includes('32.13.2.100')) continue;
            card.scrollIntoView({block:'center'}); card.click(); return true;
          }
          return false;''')
              print('version-card-clicked', clicked)
              time.sleep(2.0)
              print('release-url', safe_url(browser.current_url), 'title', browser.title)
              button = browser.execute_script(r'''
          const e=document.querySelector('#detail-download-button');
          if(!e) return null;
          return {tag:e.tagName, text:String(e.innerText||e.textContent||'').trim(),
                  attrs:Array.from(e.attributes).map(a=>a.name),
                  hasHref:Boolean(e.getAttribute('href')), hasDataUrl:Boolean(e.getAttribute('data-url')),
                  hasOnclick:Boolean(e.getAttribute('onclick'))};''')
              print('button-shape', button)
              browser.get_log('performance')
              download_clicked = browser.execute_script(r'''
          const e=document.querySelector('#detail-download-button');
          if(!e) return false; e.scrollIntoView({block:'center'}); e.click(); return true;''')
              print('download-clicked', download_clicked)
              time.sleep(3.0)
              print('after-download-click-url', safe_url(browser.current_url), 'title', browser.title)
              after = browser.execute_script(r'''
          for (const s of ['.post-download[data-url]','#detail-download-button[data-url]',
                           '[data-url*="/dwn/"]','a[href*="dw.uptodown.com/dwn/"]']) {
            const e=document.querySelector(s); if(!e) continue;
            const raw=e.getAttribute('data-url')||e.getAttribute('href')||'';
            return {selector:s, hasTarget:Boolean(raw), targetLength:String(raw).length};
          }
          return null;''')
              print('after-target', after)
              seen=[]
              for item in browser.get_log('performance'):
                  try: msg=json.loads(item['message'])['message']
                  except Exception: continue
                  if msg.get('method') != 'Network.requestWillBeSent': continue
                  raw=msg.get('params',{}).get('request',{}).get('url','')
                  host=(urlparse(raw).hostname or '')
                  if not (host.endswith('uptodown.com') or host.endswith('utdstc.com')): continue
                  safe=safe_url(raw)
                  if safe not in seen: seen.append(safe)
              print('network-paths', seen[-30:])
          finally:
              browser.quit()
          PY
