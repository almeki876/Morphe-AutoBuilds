name: Configuration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Configuration
        run: python3 scripts/validate_repository.py

      - name: Compile Python Sources
        run: python3 -m compileall -q src scripts

      - name: Compile Google Play Downloader
        run: mvn -q -f tools/gplaydl/pom.xml -DskipTests package

      - name: Import Provider Registry
        run: >-
          python3 -c
          "from src import providers;
          errors = providers.validate_all_configs();
          assert not errors, errors"

      - name: Run Unit Tests
        run: python3 -m unittest discover tests

      - name: Diagnose Uptodown historical variant metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome = (shutil.which('google-chrome') or shutil.which('google-chrome-stable')
                    or shutil.which('chromium') or shutil.which('chromium-browser'))
          driver_path = shutil.which('chromedriver')
          if not chrome or not driver_path:
              raise SystemExit(f'Chrome unavailable: chrome={bool(chrome)} driver={bool(driver_path)}')
          options = Options(); options.binary_location = chrome
          for arg in ('--headless=new', '--no-sandbox', '--disable-dev-shm-usage',
                      '--disable-gpu', '--window-size=1365,1600', '--lang=en-US'):
              options.add_argument(arg)
          browser = webdriver.Chrome(service=Service(driver_path), options=options)
          browser.set_page_load_timeout(30)
          browser.set_script_timeout(30)
          try:
              browser.get('https://amazon-shopping.en.uptodown.com/android/versions')
              time.sleep(1.2)
              clicked = browser.execute_script(r'''
          for (const card of document.querySelectorAll('[data-version-id]')) {
            if (!String(card.innerText||card.textContent||'').includes('32.13.2.100')) continue;
            card.click(); return true;
          }
          return false;''')
              print('version-card-clicked', clicked)
              time.sleep(1.8)
              meta = browser.execute_script(r'''
          const e=document.querySelector('#detail-download-button');
          const h=document.querySelector('#detail-app-name');
          const cardId=(location.pathname.match(/\/download\/([^/?#]+)/)||[])[1]||'';
          if(!e) return null;
          const onclick=String(e.getAttribute('onclick')||'').replace(/[A-Za-z0-9_-]{25,}/g,'<opaque>');
          return {
            cardId,
            dataAppId:e.getAttribute('data-app-id')||'',
            dataFileId:e.getAttribute('data-file-id')||'',
            dataDownloadVersion:e.getAttribute('data-download-version')||'',
            dataOnlyXapk:e.getAttribute('data-only-xapk')||'',
            headingCode:h&&h.getAttribute('data-code')||'',
            onclick
          };''')
              print('release-meta', meta)
              if not meta:
                  raise SystemExit('missing historical download metadata')
              probes=[]
              app_ids=[]
              for key in ('headingCode','dataAppId'):
                  value=str(meta.get(key) or '').strip()
                  if value and value not in app_ids: app_ids.append(value)
              versions=[]
              for key in ('cardId','dataDownloadVersion'):
                  value=str(meta.get(key) or '').strip()
                  if value and value not in versions: versions.append(value)
              for app_id in app_ids:
                  for version_id in versions:
                      result = browser.execute_async_script(r'''
          const done=arguments[arguments.length-1];
          const url=arguments[0];
          fetch(url,{credentials:'same-origin'}).then(async r=>{
            const text=await r.text();
            let parsed=null; try{parsed=JSON.parse(text)}catch(e){}
            const content=parsed&&typeof parsed==='object' ? String(parsed.content||'') : '';
            const box=document.createElement('div'); box.innerHTML=content;
            const rows=Array.from(box.querySelectorAll('.variant')).slice(0,8).map(v=>{
              const report=v.querySelector('.v-report[data-file-id]');
              const type=v.querySelector('.v-file > span');
              const html=String(v.outerHTML||'');
              return {fileId:report&&report.getAttribute('data-file-id')||'', type:type&&String(type.textContent||'').trim()||'', hasPostDownload:/\/android\/post-download\//.test(html)};
            });
            done({status:r.status, rows});
          }).catch(e=>done({status:0,error:String(e)}));''', f'/app/{app_id}/version/{version_id}/files')
                      probes.append({'appId':app_id,'versionId':version_id,'result':result})
              print('variant-probes', probes)
          finally:
              browser.quit()
          PY
