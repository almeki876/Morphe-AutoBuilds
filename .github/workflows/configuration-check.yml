name: Configuration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Configuration
        run: python3 scripts/validate_repository.py

      - name: Compile Python Sources
        run: python3 -m compileall -q src scripts

      - name: Compile Google Play Downloader
        run: mvn -q -f tools/gplaydl/pom.xml -DskipTests package

      - name: Import Provider Registry
        run: >-
          python3 -c
          "from src import providers;
          errors = providers.validate_all_configs();
          assert not errors, errors"

      - name: Run Unit Tests
        run: python3 -m unittest discover tests

      - name: Diagnose Uptodown historical variants route
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome = (shutil.which('google-chrome') or shutil.which('google-chrome-stable')
                    or shutil.which('chromium') or shutil.which('chromium-browser'))
          driver_path = shutil.which('chromedriver')
          if not chrome or not driver_path:
              raise SystemExit(f'Chrome unavailable: chrome={bool(chrome)} driver={bool(driver_path)}')
          options = Options(); options.binary_location = chrome
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,1600','--lang=en-US'):
              options.add_argument(arg)
          browser = webdriver.Chrome(service=Service(driver_path), options=options)
          browser.set_page_load_timeout(30); browser.set_script_timeout(30)
          try:
              browser.get('https://amazon-shopping.en.uptodown.com/android/versions')
              time.sleep(1.2)
              browser.execute_script(r'''
          for (const card of document.querySelectorAll('[data-version-id]')) {
            if (String(card.innerText||card.textContent||'').includes('32.13.2.100')) { card.click(); return; }
          }''')
              time.sleep(1.8)
              ids = browser.execute_script(r'''
          const h=document.querySelector('#detail-app-name');
          const variants=document.querySelector('.variants[data-version], button.variants[data-version]');
          return {appID:h&&h.getAttribute('data-code')||'', versionID:variants&&variants.getAttribute('data-version')||''};''')
              print('route-ids', ids)
              result = browser.execute_async_script(r'''
          const done=arguments[arguments.length-1], app=arguments[0], ver=arguments[1];
          fetch(`/app/${app}/version/${ver}/files`,{credentials:'same-origin'}).then(async r=>{
            const text=await r.text(); let payload=null; try{payload=JSON.parse(text)}catch(e){}
            const content=payload&&payload.content?String(payload.content):'';
            const box=document.createElement('div'); box.innerHTML=content;
            const rows=Array.from(box.querySelectorAll('.variant')).slice(0,10).map(v=>{
              const report=v.querySelector('.v-report[data-file-id]');
              const type=v.querySelector('.v-file > span');
              const html=String(v.outerHTML||'');
              return {fileId:report&&report.getAttribute('data-file-id')||'', type:type&&String(type.textContent||'').trim()||'',
                      hasPostDownload:/\/android\/post-download\//.test(html), hasDirect:/dw\.uptodown\.com\/dwn\//.test(html),
                      hasOnclick:Boolean(v.getAttribute('onclick')||v.querySelector('[onclick]'))};
            });
            done({status:r.status,title:payload&&payload.title||'',rows});
          }).catch(e=>done({status:0,error:String(e)}));''', ids['appID'], ids['versionID'])
              print('variants-result', result)
              clicked = browser.execute_script(r'''
          const e=document.querySelector('.variants[data-version], button.variants[data-version]');
          if(!e)return false; e.click(); return true;''')
              print('variants-clicked', clicked)
              time.sleep(1.5)
              visible = browser.execute_script(r'''
          return Array.from(document.querySelectorAll('.variant')).slice(0,10).map(v=>({
            text:String(v.innerText||v.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),
            attrs:Array.from(v.attributes).map(a=>a.name),
            hasPostDownload:/\/android\/post-download\//.test(String(v.outerHTML||''))
          }));''')
              print('visible-variants', visible)
          finally:
              browser.quit()
          PY
