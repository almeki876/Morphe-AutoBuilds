name: "CI: 設定・テスト検証"

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  actions: read
  contents: write

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python project
        uses: ./.github/actions/setup-python-project

      - name: Apply one-time integrated finalization migration
        run: python3 scripts/_migrate_integrated_finalization.py

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions Workflows
        run: /tmp/actionlint

      - name: Summarize Recent Workflow Health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --slurp > /tmp/workflow-runs.json
          python3 scripts/summarize_workflow_history.py \
            /tmp/workflow-runs.json \
            --current-run-id "${{ github.run_id }}" \
            --output /tmp/workflow-health.md
          cat /tmp/workflow-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Configuration
        run: python3 scripts/validate_repository.py

      - name: Compile Python Sources
        run: python3 -m compileall -q src scripts

      - name: Import Provider Registry
        run: >-
          python3 -c
          "from src import providers;
          errors = providers.validate_all_configs();
          assert not errors, errors"

      - name: Run Unit Tests
        run: python3 -m unittest discover tests

      - name: Commit validated migration
        if: success()
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: integrate successful-build finalization into primary workflow [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
