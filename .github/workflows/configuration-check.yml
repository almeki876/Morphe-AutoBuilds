name: Configuration Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Configuration
        run: python3 scripts/validate_repository.py

      - name: Compile Python Sources
        run: python3 -m compileall -q src scripts

      - name: Compile Google Play Downloader
        run: mvn -q -f tools/gplaydl/pom.xml -DskipTests package

      - name: Import Provider Registry
        run: >-
          python3 -c
          "from src import providers;
          errors = providers.validate_all_configs();
          assert not errors, errors"

      - name: Run Unit Tests
        run: python3 -m unittest discover tests

      - name: Diagnose Uptodown historical JS contract
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome = (shutil.which('google-chrome') or shutil.which('google-chrome-stable')
                    or shutil.which('chromium') or shutil.which('chromium-browser'))
          driver_path = shutil.which('chromedriver')
          if not chrome or not driver_path:
              raise SystemExit(f'Chrome unavailable: chrome={bool(chrome)} driver={bool(driver_path)}')
          options = Options(); options.binary_location = chrome
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,1600','--lang=en-US'):
              options.add_argument(arg)
          browser = webdriver.Chrome(service=Service(driver_path), options=options)
          browser.set_page_load_timeout(30); browser.set_script_timeout(30)
          try:
              browser.get('https://amazon-shopping.en.uptodown.com/android/versions')
              time.sleep(1.2)
              browser.execute_script(r'''
          for (const card of document.querySelectorAll('[data-version-id]')) {
            if (String(card.innerText||card.textContent||'').includes('32.13.2.100')) { card.click(); return; }
          }''')
              time.sleep(1.8)
              dom = browser.execute_script(r'''
          const out=[];
          for (const e of document.querySelectorAll('a,button,div,span')) {
            const text=String(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim();
            const cls=String(e.className||'');
            const attrs=Array.from(e.attributes||[]).map(a=>a.name);
            if (!/variant|xapk|apk|download|file/i.test(text+' '+cls+' '+attrs.join(' '))) continue;
            if (text.length>180) continue;
            out.push({tag:e.tagName,text,cls:cls.slice(0,140),attrs,href:e.getAttribute('href')||'',
                      dataFileId:e.getAttribute('data-file-id')||'',dataVersion:e.getAttribute('data-version')||'',
                      dataDownloadVersion:e.getAttribute('data-download-version')||'',dataDwldng:e.getAttribute('data-dwldng')||''});
            if(out.length>=60) break;
          }
          return out;''')
              print('interesting-dom', dom)
              scripts = browser.execute_script(r'''
          return Array.from(document.scripts).map(s=>s.src).filter(Boolean).filter(x=>/download|detail|app|android/i.test(x));''')
              print('candidate-scripts', scripts)
              for src in scripts[:12]:
                  result = browser.execute_async_script(r'''
          const done=arguments[arguments.length-1], url=arguments[0];
          fetch(url).then(r=>r.text()).then(text=>{
            const terms=['data-dwldng','data-download-version','data-file-id','post-download','/app/','downloadUrl','only-xapk'];
            const hits=[];
            for(const term of terms){
              let pos=0,count=0;
              while((pos=text.indexOf(term,pos))>=0 && count<8){
                const start=Math.max(0,pos-220), end=Math.min(text.length,pos+term.length+350);
                let snip=text.slice(start,end).replace(/[A-Za-z0-9_-]{40,}/g,'<opaque>');
                hits.push({term,snip}); pos+=term.length; count++;
              }
            }
            done({url,length:text.length,hits:hits.slice(0,24)});
          }).catch(e=>done({url,error:String(e)}));''', src)
                  if result.get('hits'):
                      print('script-hits', result)
          finally:
              browser.quit()
          PY
