name: "自動: アップストリーム更新を確認"

on:
  schedule:
    # GitHub Actions cron is UTC: 03:00 JST is 18:00 UTC on the previous day.
    - cron: '0 18 * * *'  # JST 03:00
    - cron: '0 12 * * *'  # JST 21:00
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Check All Upstream Patch Sources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Repository Configuration
        run: python3 scripts/validate_repository.py

      - name: Check all declared patch sources
        id: all_sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_upstream_sources.py

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tools for version detection
        id: dl-cli
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
          SOURCE_TAGS_JSON: ${{ steps.all_sources.outputs.source_tags }}
        run: |
          pip install -r requirements.txt --quiet
          python3 scripts/download_all_tools.py

      - name: Detect version-pinned apps
        id: pinned
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAGS_JSON: ${{ steps.all_sources.outputs.source_tags }}
        run: python3 scripts/detect_version_pinned.py

      - name: Prepare local Google Play dispenser
        # clone / go build / docker pull は低速になりやすい（初回は約6分かかっていた）。
        # exit node を通す前に、専用ステップ（専用タイムアウト・専用ログ）で済ませる。
        # 失敗しても後続の ensure_running() が自力で準備を再試行する。
        id: prepare-dispenser
        if: ${{ steps.pinned.outputs.free_version_apps != '[]' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
          GPLAYDL_DISPENSER_WORKDIR: ${{ runner.temp }}/gplaydl-dispenser
        run: python3 -m src.local_gplaydl_dispenser prepare

      - name: Connect version discovery to Tailscale
        id: version-tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Select Japanese exit node for version discovery
        id: version-tailscale-exit
        if: ${{ steps.version-tailscale.outcome == 'success' }}
        continue-on-error: true
        env:
          TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
        run: |
          exit_node_ip="$(python3 scripts/resolve_tailscale_exit_node.py "$TS_EXIT_NODE")"
          # --accept-dns=false を付与してランナーの正常なDNSを維持する
          # --exit-node-allow-lan-access=true: 無いと Docker ブリッジ(172.17.0.0/16)宛の
          # 通信まで exit node へ送られ、ローカル dispenser が Postgres に届かず無言で固まる
          sudo tailscale set --exit-node="$exit_node_ip" --exit-node-allow-lan-access=true --accept-dns=false
          tailscale ping -c 3 "$exit_node_ip"

      - name: Verify Japanese egress for version discovery
        id: verify-egress
        if: ${{ steps.version-tailscale-exit.outcome == 'success' }}
        continue-on-error: true
        run: python3 scripts/verify_japan_egress.py

      - name: Fallback if Japanese egress failed
        # Egress検証が失敗した場合は Exit Node を解除して通信詰まりを防止
        if: ${{ steps.version-tailscale-exit.outcome == 'success' && steps.verify-egress.outcome != 'success' }}
        run: |
          echo "::warning::Exit node 経由の通信検証に失敗したため、Exit node を解除して通常回線に切り替えます。"
          sudo tailscale set --exit-node=""

      - name: Check APK versions
        id: apkver
        continue-on-error: true
        # スクリプト側の締め切り(900s)で正常終了させ、出力とレポートを残す。
        # こちらは dispenser 等がハングした場合の最終防衛線。
        timeout-minutes: 18
        env:
          GPLAYDL_DISPENSER_WORKDIR: ${{ runner.temp }}/gplaydl-dispenser
          APK_CHECK_DEADLINE_SECONDS: '900'
          APK_PLAY_MAX_CONSECUTIVE_FAILURES: '3'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PINNED_APPS: ${{ steps.pinned.outputs.version_pinned_apps }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
          GPLAYDL_PREFERRED_PROFILE: ${{ vars.GPLAYDL_PREFERRED_PROFILE }}
        run: python3 scripts/check_apk_versions.py

      - name: Publish APK version health
        if: always() && hashFiles('apk-version-health.md') != ''
        run: cat apk-version-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger build for detected updates
        if: steps.all_sources.outputs.any_updated == 'true' || steps.apkver.outputs.any_apk_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATED_SOURCES: ${{ steps.all_sources.outputs.updated_sources }}
          UPDATED_APPS: ${{ steps.apkver.outputs.updated_apps }}
          APK_UPDATED_APPS: ${{ steps.apkver.outputs.apk_updated_apps }}
          SOURCE_TAGS: ${{ steps.all_sources.outputs.source_tags }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run build.yml \
            --repo "$REPO" \
            --ref main \
            -f source_tags="$SOURCE_TAGS" \
            -f updated_sources="$UPDATED_SOURCES" \
            -f updated_apps="$UPDATED_APPS" \
            -f apk_updated_apps="${APK_UPDATED_APPS:-[]}"
          echo "Build workflow triggered for sources=[$UPDATED_SOURCES] apps=[$UPDATED_APPS]"

      - name: Log no updates
        if: steps.all_sources.outputs.any_updated != 'true' && steps.apkver.outputs.any_apk_updated != 'true'
        run: echo "No patch-source or APK updates found."
