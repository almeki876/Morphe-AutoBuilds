name: Check Upstream for Updates

on:
  schedule:
    - cron: '0 9 * * *' # 18:00 JST
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check Declared Patch Sources and Base APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Repository Configuration
        run: python3 scripts/validate_repository.py

      - name: Check All Declared Patch Sources
        id: sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_upstream_sources.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Current Source Tools for Version Detection
        id: tools
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt -q
          python3 scripts/download_all_tools.py

      - name: Detect Version-Pinned Apps
        id: pinned
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/detect_version_pinned.py

      - name: Check APK Versions
        id: apkver
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PINNED_APPS: ${{ steps.pinned.outputs.version_pinned_apps }}
        run: python3 scripts/check_apk_versions.py

      - name: Publish APK Version Health
        if: always() && hashFiles('apk-version-health.md') != ''
        run: cat apk-version-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Build for Detected Changes
        if: steps.sources.outputs.any_updated == 'true' || steps.apkver.outputs.any_apk_updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED_SOURCES: ${{ steps.sources.outputs.updated_sources }}
          UPDATED_APPS: ${{ steps.apkver.outputs.updated_apps }}
          APK_UPDATED_APPS: ${{ steps.apkver.outputs.apk_updated_apps }}
        run: |
          echo "Patch sources: ${UPDATED_SOURCES:-none}"
          echo "Base APK apps: ${UPDATED_APPS:-none}"
          gh workflow run build.yml \
            -f updated_sources="${UPDATED_SOURCES}" \
            -f updated_apps="${UPDATED_APPS}" \
            -f apk_updated_apps="${APK_UPDATED_APPS:-[]}"

      - name: Log No Updates
        if: steps.sources.outputs.any_updated != 'true' && steps.apkver.outputs.any_apk_updated != 'true'
        run: |
          echo "No patch-source or base-APK updates found."
          cat last-tags.json 2>/dev/null || true
