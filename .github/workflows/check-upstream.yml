name: "自動: アップストリーム更新を確認"

on:
  schedule:
    - cron: '0 9 * * *'   # JST 18:00
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: true

jobs:
  check-upstream:
    name: Check All Upstream Patch Sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Repository Configuration
        run: python3 scripts/validate_repository.py

      - name: Check all declared patch sources
        id: all_sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_upstream_sources.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tools for version detection
        id: dl-cli
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
          SOURCE_TAGS_JSON: ${{ steps.all_sources.outputs.source_tags }}
        run: |
          pip install -r requirements.txt --quiet
          python3 scripts/download_all_tools.py

      - name: Detect version-pinned apps
        id: pinned
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAGS_JSON: ${{ steps.all_sources.outputs.source_tags }}
        run: python3 scripts/detect_version_pinned.py

      - name: Connect version discovery to Tailscale
        id: version-tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Select Japanese exit node for version discovery
        id: version-tailscale-exit
        if: ${{ steps.version-tailscale.outcome == 'success' }}
        continue-on-error: true
        env:
          TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
        run: |
          exit_node_ip="$(python3 scripts/resolve_tailscale_exit_node.py "$TS_EXIT_NODE")"
          sudo tailscale set --exit-node="$exit_node_ip"
          tailscale ping "$exit_node_ip"

      - name: Verify Japanese egress for version discovery
        if: ${{ steps.version-tailscale-exit.outcome == 'success' }}
        continue-on-error: true
        run: python3 scripts/verify_japan_egress.py

      - name: Check APK versions
        id: apkver
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PINNED_APPS: ${{ steps.pinned.outputs.version_pinned_apps }}
          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}
          GPLAY_AAS_TOKEN: ${{ secrets.GPLAY_AAS_TOKEN }}
          GPLAYDL_PREFERRED_PROFILE: ${{ vars.GPLAYDL_PREFERRED_PROFILE }}
        run: python3 scripts/check_apk_versions.py

      - name: Publish APK version health
        if: always() && hashFiles('apk-version-health.md') != ''
        run: cat apk-version-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger build for detected updates
        if: steps.all_sources.outputs.any_updated == 'true' || steps.apkver.outputs.any_apk_updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATED_SOURCES: ${{ steps.all_sources.outputs.updated_sources }}
          UPDATED_APPS: ${{ steps.apkver.outputs.updated_apps }}
          APK_UPDATED_APPS: ${{ steps.apkver.outputs.apk_updated_apps }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f source_tags='${{ steps.all_sources.outputs.source_tags }}' \
            -f updated_sources="$UPDATED_SOURCES" \
            -f updated_apps="$UPDATED_APPS" \
            -f apk_updated_apps="${APK_UPDATED_APPS:-[]}"
          echo "Build workflow triggered for sources=[$UPDATED_SOURCES] apps=[$UPDATED_APPS]"

      - name: Log no updates
        if: steps.all_sources.outputs.any_updated != 'true' && steps.apkver.outputs.any_apk_updated != 'true'
        run: echo "No patch-source or APK updates found."
