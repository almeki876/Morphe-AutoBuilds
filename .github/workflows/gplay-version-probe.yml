name: APK Source Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gplay-version-probe.yml'
  pull_request:
    paths:
      - '.github/workflows/gplay-version-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check 'gplaydl==4.2.1' 'beautifulsoup4==4.15.0' 'requests>=2.34' 'selenium==4.46.0'
      - name: Probe linked Play metadata
        shell: bash
        run: |
          set -u
          packages=(
            'com.amazon.mShop.android.shopping'
            'com.adobe.reader'
            'com.adobe.lrmobile'
            'com.crunchyroll.crunchyroid'
            'jp.ne.ibis.ibispaintx.app'
          )
          for package in "${packages[@]}"; do
            echo "===== PLAY ${package} ====="
            gplaydl info "${package}" --arch arm64 || true
          done
      - name: Probe Uptodown exact history-card routes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          targets = [
              ('amazon-shopping', '32.13.2.100'),
              ('adobe-lightroom-mobile', '11.4.5'),
              ('crunchyroll', '3.113.2'),
          ]
          headers = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'}

          def contains(text, version):
              return re.search(rf'(?<![0-9A-Za-z]){re.escape(version)}(?![0-9A-Za-z])', text or '', re.I) is not None

          for slug, version in targets:
              versions_url = f'https://{slug}.en.uptodown.com/android/versions'
              print(f'===== UPTODOWN {slug} {version} =====')
              try:
                  r = requests.get(versions_url, headers=headers, timeout=20)
              except Exception as e:
                  print('history request error', type(e).__name__, e)
                  continue
              print('history', r.status_code, r.url, 'bytes', len(r.content))
              soup = BeautifulSoup(r.content, 'html.parser')
              cards = soup.select('[data-version-id]')
              print('cards', len(cards))
              for card in cards:
                  text = card.get_text(' ', strip=True)
                  attrs = {k: str(card.get(k) or '') for k in ('data-version-id','data-url','data-extra-url','href')}
                  if not contains(text, version) and not any(contains(v, version) for v in attrs.values()):
                      continue
                  print('MATCH text=', text[:240])
                  print('attrs=', attrs)
                  vid = attrs['data-version-id'].strip()
                  data_url = attrs['data-url'].strip()
                  extra = attrs['data-extra-url'].strip().strip('/') or 'download'
                  root = urljoin(versions_url, data_url) if data_url else versions_url.rsplit('/versions',1)[0]
                  parsed = urlparse(root)
                  path = parsed.path.rstrip('/')
                  if path.endswith('/versions'):
                      path = path[:-len('/versions')]
                  if path.endswith('/download'):
                      path = path[:-len('/download')]
                  if vid:
                      canonical = f'{parsed.scheme}://{parsed.netloc}{path}/{extra}/{vid}'
                      rr = requests.get(canonical, headers=headers, timeout=20, allow_redirects=True)
                      print('canonical response', rr.status_code, rr.url, 'bytes', len(rr.content))
          PY
      - name: Observe exact Amazon card in Chrome
        shell: bash
        run: |
          python - <<'PY'
          import shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable') or shutil.which('chromium')
          driver_path = shutil.which('chromedriver')
          print('chrome?', bool(chrome), 'driver?', bool(driver_path))
          opts = Options()
          opts.binary_location = chrome
          for arg in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1365,1600'):
              opts.add_argument(arg)
          browser = webdriver.Chrome(service=Service(driver_path), options=opts)
          browser.set_page_load_timeout(30)
          try:
              url='https://amazon-shopping.en.uptodown.com/android/versions'
              browser.get(url)
              time.sleep(1)
              print('history current=', browser.current_url, 'title=', browser.title)
              info_js = "const want='32.13.2.100'; for (const card of document.querySelectorAll('[data-version-id]')) { const text=String(card.innerText||card.textContent||'').replace(/\\s+/g,' ').trim(); if (!text.includes(want)) continue; const nodes=[card,...card.querySelectorAll('a,button,[role=\"button\"],[data-url],[data-href]')]; return {text,outer:card.outerHTML.slice(0,4000),attrs:Object.fromEntries(Array.from(card.attributes).map(a=>[a.name,a.value])),children:nodes.slice(0,12).map(n=>({tag:n.tagName,href:n.getAttribute('href')||'',dataUrl:n.getAttribute('data-url')||'',dataHref:n.getAttribute('data-href')||'',onclick:n.getAttribute('onclick')||'',role:n.getAttribute('role')||''}))}; } return null;"
              info = browser.execute_script(info_js)
              print('card=', info)
              click_js = "const want='32.13.2.100'; for (const card of document.querySelectorAll('[data-version-id]')) { const text=String(card.innerText||card.textContent||'').replace(/\\s+/g,' ').trim(); if (!text.includes(want)) continue; const clickable=card.matches('a,button,[role=\"button\"]')?card:card.querySelector('a,button,[role=\"button\"]'); if (clickable) { clickable.click(); return true; } card.click(); return true; } return false;"
              clicked = browser.execute_script(click_js)
              print('clicked=', clicked)
              time.sleep(2)
              print('after click current=', browser.current_url, 'title=', browser.title)
              target_js = "const selectors=['#detail-download-button','[data-url*=\"/dwn/\"]','a[href*=\"dw.uptodown.com/dwn/\"]','.post-download[data-url]']; for (const s of selectors) for (const e of document.querySelectorAll(s)) return {selector:s,href:e.getAttribute('href')||'',dataUrl:e.getAttribute('data-url')||''}; return null;"
              target = browser.execute_script(target_js)
              print('download target=', target)
          finally:
              browser.quit()
          PY
