name: ops-dispatch-branding-ja-e2e

on:
  pull_request:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'ops/dispatch-branding-ja-e2e'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh E2E from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo "${{ github.repository }}" --ref main -f build_all_sources=true
