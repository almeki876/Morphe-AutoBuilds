name: PR Targeted Build Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/check-upstream.yml'
      - '.github/workflows/pr-targeted-build-verification.yml'
      - 'scripts/download_all_tools.py'
      - 'scripts/download_apks.py'
      - 'scripts/prepare_matrix.py'
      - 'scripts/check_upstream_sources.py'
      - 'src/**'
      - 'sources/**'
      - 'apps/**'
      - 'my-patch-config.json'
      - 'patches/**'
      - 'tests/**'
      - 'arch-config.json'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Run targeted APK verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select minimal build scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only \
            | python3 scripts/pr_build_scope.py --github-output "$GITHUB_OUTPUT"

      - name: Skip APK build when no runtime input changed
        if: steps.scope.outputs.needs_build != 'true'
        run: echo "No app, patch source, or build-runtime change requires an APK build." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch targeted build and wait for its conclusion
        if: steps.scope.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATED_APPS: ${{ steps.scope.outputs.updated_apps }}
          UPDATED_SOURCES: ${{ steps.scope.outputs.updated_sources }}
        run: |
          set -euo pipefail

          # A rerun of this PR check can see an older workflow_dispatch run for
          # the same branch/SHA. Remember it before dispatch so we only watch the
          # run created by this invocation.
          previous_run_id=$(gh run list \
            --repo "$REPO" \
            --workflow build.yml \
            --branch "$REF" \
            --event workflow_dispatch \
            --commit "$HEAD_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          gh workflow run build.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f updated_apps="$UPDATED_APPS" \
            -f updated_sources="$UPDATED_SOURCES"

          run_id=''
          for _ in $(seq 1 30); do
            candidate_run_id=$(gh run list \
              --repo "$REPO" \
              --workflow build.yml \
              --branch "$REF" \
              --event workflow_dispatch \
              --commit "$HEAD_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$candidate_run_id" ] && [ "$candidate_run_id" != "$previous_run_id" ]; then
              run_id="$candidate_run_id"
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo '::error::Newly dispatched Build Apps run could not be identified.'
            exit 1
          fi

          run_url="https://github.com/$REPO/actions/runs/$run_id"
          echo "Targeted build: $run_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Apps: ${UPDATED_APPS:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "Sources: ${UPDATED_SOURCES:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting for targeted Build Apps run $run_id to finish..."

          # --exit-status makes this PR check fail when any downstream build job fails.
          gh run watch "$run_id" --repo "$REPO" --interval 20 --exit-status
