name: PR Targeted Build Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/check-upstream.yml'
      - '.github/workflows/pr-targeted-build-verification.yml'
      - 'scripts/download_all_tools.py'
      - 'scripts/download_apks.py'
      - 'scripts/prepare_matrix.py'
      - 'scripts/check_upstream_sources.py'
      - 'src/**'
      - 'sources/**'
      - 'apps/**'
      - 'my-patch-config.json'
      - 'arch-config.json'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch regression build set on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref }}
        run: |
          gh workflow run build.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f updated_apps='adobe-acrobat,amazon-shopping,crunchyroll,fing,ibs_paint,lightroom,nova,twitch-android-tv,youtube-music'
