name: PR Targeted Build Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/check-upstream.yml'
      - '.github/workflows/pr-targeted-build-verification.yml'
      - 'scripts/download_all_tools.py'
      - 'scripts/download_apks.py'
      - 'scripts/prepare_matrix.py'
      - 'scripts/check_upstream_sources.py'
      - 'src/**'
      - 'sources/**'
      - 'apps/**'
      - 'my-patch-config.json'
      - 'patches/**'
      - 'tests/**'
      - 'arch-config.json'

permissions:
  actions: write
  contents: read

jobs:
  verify:
    name: Run and verify open-issue regression builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dispatch regression build and wait for its conclusion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A rerun of this PR check can see an older workflow_dispatch run for
          # the same branch/SHA. Remember it before dispatch so we only watch the
          # run created by this invocation.
          previous_run_id=$(gh run list \
            --repo "$REPO" \
            --workflow build.yml \
            --branch "$REF" \
            --event workflow_dispatch \
            --commit "$HEAD_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          gh workflow run build.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f updated_apps='adobe-acrobat,amazon-shopping,crunchyroll,fing,ibs_paint,lightroom,nova,poweramp,twitch-android-tv,yuucho-tsucho,yuucho-ninsho'

          run_id=''
          for _ in $(seq 1 30); do
            candidate_run_id=$(gh run list \
              --repo "$REPO" \
              --workflow build.yml \
              --branch "$REF" \
              --event workflow_dispatch \
              --commit "$HEAD_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$candidate_run_id" ] && [ "$candidate_run_id" != "$previous_run_id" ]; then
              run_id="$candidate_run_id"
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo '::error::Newly dispatched Build Apps run could not be identified.'
            exit 1
          fi

          run_url="https://github.com/$REPO/actions/runs/$run_id"
          echo "Regression build: $run_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Waiting for Build Apps run $run_id to finish..."

          # --exit-status makes this PR check fail when any downstream build job fails.
          gh run watch "$run_id" --repo "$REPO" --interval 20 --exit-status
