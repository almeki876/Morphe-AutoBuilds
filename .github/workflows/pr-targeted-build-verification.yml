name: PR Targeted Build Verification

on:
  push:
    branches:
      - chatgpt/resolve-open-build-issues
    paths:
      - .github/workflows/pr-targeted-build-verification.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Run targeted build verification'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch unresolved app builds on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          gh workflow run build.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f updated_apps='adobe-scan,brave-beta,brave-nightly,disney-plus,gboard,proton-vpn,amazon-music,amazon-shopping,tumblr'
