name: "TEMP: Integrate VirusTotal cache into Release"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_integrate-vt-cache-into-release.yml

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Patch Release creation and remove this temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          needle = '''          find ./release-apks -name '*.apk' -print0 \\
            | xargs -0 -r -P 8 -I {} gh release upload "$release_tag" "{}"

          echo "Release created and APK assets uploaded successfully!"
'''
          replacement = '''          find ./release-apks -name '*.apk' -print0 \\
            | xargs -0 -r -P 8 -I {} gh release upload "$release_tag" "{}"

          python3 scripts/export_virustotal_cache.py \\
            virustotal_base_results.json \\
            virustotal-cache-v1.json
          test -s virustotal-cache-v1.json
          gh release upload "$release_tag" virustotal-cache-v1.json \\
            --repo "${{ github.repository }}" \\
            --clobber
          echo "VirusTotal SHA cache attached to $release_tag"

          echo "Release created and APK assets uploaded successfully!"
'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected one Release upload insertion point, found {count}')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          git rm .github/workflows/_integrate-vt-cache-into-release.yml

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt -q

      - name: Run complete repository test suite on migrated tree
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 scripts/validate_repository.py
            python3 -m compileall -q src scripts
            python3 -c "from src import providers; errors = providers.validate_all_configs(); assert not errors, errors"
            python3 -m unittest discover tests
          } 2>&1 | tee migration-tests.log

      - name: Report migration test failure
        if: steps.tests.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '# VirusTotal Release integration migration failed'
            echo
            echo 'The migration was not committed. Test tail:'
            echo '```text'
            tail -n 180 migration-tests.log
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > migration-failure.md
          existing=$(gh issue list --state open --search 'TEMP VT integration migration failure in:title' --json number,title --jq '.[] | select(.title == "TEMP VT integration migration failure") | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file migration-failure.md
          else
            gh issue create --title 'TEMP VT integration migration failure' --body-file migration-failure.md
          fi
          exit 1

      - name: Commit migration
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/build.yml .github/workflows/_integrate-vt-cache-into-release.yml
          git commit -m "ci: attach VirusTotal cache during Release creation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
