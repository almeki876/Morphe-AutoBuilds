name: "TEMP: Integrate VirusTotal cache into Release"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_integrate-vt-cache-into-release.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Patch Release creation and remove this temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          needle = '''          find ./release-apks -name '*.apk' -print0 \\
            | xargs -0 -r -P 8 -I {} gh release upload "$release_tag" "{}"

          echo "Release created and APK assets uploaded successfully!"
'''
          replacement = '''          find ./release-apks -name '*.apk' -print0 \\
            | xargs -0 -r -P 8 -I {} gh release upload "$release_tag" "{}"

          python3 scripts/export_virustotal_cache.py \\
            virustotal_base_results.json \\
            virustotal-cache-v1.json
          test -s virustotal-cache-v1.json
          gh release upload "$release_tag" virustotal-cache-v1.json \\
            --clobber
          echo "VirusTotal SHA cache attached to $release_tag"

          echo "Release created and APK assets uploaded successfully!"
'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected one Release upload insertion point, found {count}')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          git rm .github/workflows/_integrate-vt-cache-into-release.yml

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt -q

      - name: Run complete repository test suite on migrated tree
        run: |
          python3 scripts/validate_repository.py
          python3 -m compileall -q src scripts
          python3 -c "from src import providers; errors = providers.validate_all_configs(); assert not errors, errors"
          python3 -m unittest discover tests

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml .github/workflows/_integrate-vt-cache-into-release.yml
          git commit -m "ci: attach VirusTotal cache during Release creation [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
