name: "TEMP VT integration"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_integrate-vt-cache-into-release.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply migration
        run: python3 scripts/_migrate_vt_cache_release.py
      - name: Remove temporary files
        run: |
          git rm .github/workflows/_integrate-vt-cache-into-release.yml
          git rm scripts/_migrate_vt_cache_release.py
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -q
      - name: Validate final tree
        run: |
          python3 scripts/validate_repository.py
          python3 -m compileall -q src scripts
          python3 -c "from src import providers; errors = providers.validate_all_configs(); assert not errors, errors"
          python3 -m unittest discover tests
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: attach VirusTotal cache during Release creation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
