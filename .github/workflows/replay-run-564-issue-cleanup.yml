name: Replay Run 564 Issue Cleanup

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  cleanup:
    if: github.head_ref == 'ops/replay-run-564-issue-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed cleanup code
        uses: actions/checkout@v7

      - name: Download Run 564 build reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-results
          gh run download 32730060819 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'build-status-*' \
            --dir build-results

      - name: Diagnose cleanup matching
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Issue #1314 as seen by gh:'
          gh issue view 1314 --repo "${GITHUB_REPOSITORY}" --json number,title,author
          echo 'Issue #1319 as seen by gh:'
          gh issue view 1319 --repo "${GITHUB_REPOSITORY}" --json number,title,author
          python3 - <<'PY'
          from pathlib import Path
          from scripts import close_resolved_build_issues as cleanup

          reports = cleanup._load_reports(Path('build-results'))
          issues = cleanup._open_auto_issues()
          print('discovered_auto_issue_count=', len(issues))
          print('tracked_discovered=', [
              (issue.get('number'), issue.get('title'), (issue.get('author') or {}).get('login'))
              for issue in issues if issue.get('number') in {1314, 1319}
          ])
          for report in reports:
              if report.get('app_name') == 'youtube-music' and report.get('source') == 'revanced-anddea':
                  print('youtube_music_report=', {
                      'status': report.get('status'),
                      'source': report.get('source'),
                      'source_name': report.get('source_name'),
                      'build_succeeded': cleanup._build_succeeded(report),
                      'feature_failures': report.get('feature_failures'),
                  })
          PY

      - name: Close resolved auto-generated issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/almeki876/Morphe-AutoBuilds/actions/runs/32730060819
        run: python3 scripts/close_resolved_build_issues.py --directory build-results
