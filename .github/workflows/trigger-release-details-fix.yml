name: "一時修復: Release details publish"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-release-details-fix.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish details for verified Anddea release and record result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow publish-release-details.yml --limit 30 --json databaseId --jq '.[].databaseId' > /tmp/before.txt

          gh workflow run publish-release-details.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f run_id=32693522729 \
            -f release_tag=2026-08-24_14-30-JST

          run_id=''
          for attempt in $(seq 1 20); do
            while read -r candidate; do
              if ! grep -Fxq "$candidate" /tmp/before.txt; then
                run_id="$candidate"
                break
              fi
            done < <(gh run list --repo "${{ github.repository }}" --workflow publish-release-details.yml --event workflow_dispatch --limit 30 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
            [ -n "$run_id" ] && break
            sleep 3
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status

          mkdir -p .verification
          gh run view "$run_id" --repo "${{ github.repository }}" --json databaseId,status,conclusion,url > .verification/release-details-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/release-details-run.json
          git commit -m "ci: record release-details repair run [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
