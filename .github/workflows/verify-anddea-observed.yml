name: "一時検証: Anddea observable"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-anddea-observed.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Dispatch current-main Anddea-only build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId \
            --jq '.[].databaseId' > /tmp/before-run-ids.txt

          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f anddea_tag=latest \
            -f anddea_force_build=true \
            -f updated_sources=revanced-anddea

          run_id=''
          for attempt in $(seq 1 20); do
            while read -r candidate; do
              if ! grep -Fxq "$candidate" /tmp/before-run-ids.txt; then
                run_id="$candidate"
                break
              fi
            done < <(
              gh run list \
                --repo "${{ github.repository }}" \
                --workflow build.yml \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,createdAt \
                --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
            )
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "::error::Could not resolve newly dispatched build run ID"
            exit 1
          fi

          run_json="$(gh run view "$run_id" \
            --repo "${{ github.repository }}" \
            --json databaseId,headSha,status,conclusion,createdAt,url)"

          mkdir -p .verification
          printf '%s\n' "$run_json" > .verification/anddea-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .verification/anddea-run.json
          git commit -m "ci: record Anddea verification run [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
