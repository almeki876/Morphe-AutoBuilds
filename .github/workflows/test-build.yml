name: Trigger Test Build All (Release)

on:
  workflow_dispatch:

jobs:
  trigger-build:
    name: Trigger Full Build and Release Workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Trigger Build for Every Enabled Entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            -f build_all_sources="true" \
            -f updated_sources="" \
            -f updated_apps="" \
            -f apk_updated_apps="[]"
          echo "Full build workflow triggered successfully."
