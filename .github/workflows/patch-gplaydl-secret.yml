name: Wire gplaydl API key

on:
  push:
    branches:
      - chatgpt/fix-open-issues-243-252
    paths:
      - .github/workflows/patch-gplaydl-secret.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/fix-open-issues-243-252

      - name: Add linked-account secret mapping exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          needle = "          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}\n"
          replacement = "          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}\n          GPLAY_EMAIL: ${{ secrets.GPLAY_EMAIL }}\n"

          if "GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}" in text:
              print('GPLAYDL_API_KEY mapping already present')
          else:
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'expected exactly one download credential block, found {count}')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit workflow update and remove migration workflow
        run: |
          git rm .github/workflows/patch-gplaydl-secret.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git commit -m "ci: pass linked gplaydl API key to APK downloads"
          git push origin HEAD:chatgpt/fix-open-issues-243-252
