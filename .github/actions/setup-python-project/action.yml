name: Setup Morphe AutoBuilds Python

description: Set up Python 3.11 and optionally install pinned project dependencies.

inputs:
  install-dependencies:
    description: Install dependencies from requirements.txt.
    required: false
    default: 'true'
  quiet:
    description: Install dependencies with pip quiet output.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip

    - name: Install Python dependencies
      if: inputs.install-dependencies == 'true' && inputs.quiet != 'true'
      shell: bash
      run: python3 -m pip install -r requirements.txt

    - name: Install Python dependencies (quiet)
      if: inputs.install-dependencies == 'true' && inputs.quiet == 'true'
      shell: bash
      run: python3 -m pip install -r requirements.txt -q
